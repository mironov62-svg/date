<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск по ID</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; font-size: 16px; background-color: #4285f4; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #3367d6; }
        #result { padding: 20px; border: 1px solid #ddd; border-radius: 4px; background-color: #f9f9f9; min-height: 100px; }
        .field { margin-bottom: 10px; }
        .label { font-weight: bold; color: #555; }
        .value { margin-top: 2px; font-size: 18px; }
        .error { color: red; }
    </style>
</head>
<body>

    <h2>Поиск записи</h2>
    
    <div class="input-group">
        <input type="text" id="idInput" placeholder="Введите ID..." />
        <button onclick="search()">Найти</button>
    </div>

    <div id="result">
        Введите ID и нажмите «Найти».
    </div>

    <script>
        // ВСТАВЬТЕ СЮДА ВАШУ ССЫЛКУ ИЗ GOOGLE APPS SCRIPT
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyxiNmco4rWVER0fg2I5CWphVt8Su85DH3m3eDm2lr2_CYadPCad_wFjOSWNF-A9Ju-jw/exec';

        // Эта функция будет вызвана, когда Google вернет данные
        function showResults(data) {
            const resultDiv = document.getElementById('result');

            if (data.error) {
                resultDiv.innerHTML = `<span class="error">Ошибка: ${data.error}</span>`;
                return;
            }

            resultDiv.innerHTML = `
                <div class="field"><span class="label">ID:</span> <div class="value">${data['ID'] || '—'}</div></div>
                <div class="field"><span class="label">Учреждение:</span> <div class="value">${data['Учреждение'] || '—'}</div></div>
                <div class="field"><span class="label">Наименование МИ:</span> <div class="value">${data['Наименование МИ'] || '—'}</div></div>
                <div class="field"><span class="label">Дата начала:</span> <div class="value">${data['Дата начала'] || '—'}</div></div>
            `;
        }

        // Функция поиска через JSONP (обходит CORS)
        function search() {
            const id = document.getElementById('idInput').value.trim();
            const resultDiv = document.getElementById('result');

            if (!id) {
                resultDiv.innerHTML = '<span class="error">Пожалуйста, введите ID.</span>';
                return;
            }

            resultDiv.innerHTML = 'Загрузка...';

            // Создаем уникальное имя функции
            const callbackName = 'jsonp_callback_' + Math.round(100000 * Math.random());
            
            // Привязываем нашу функцию showResults к этому имени
            window[callbackName] = function(data) {
                showResults(data);
                // Убираем за собой скрипт и функцию
                document.body.removeChild(script);
                delete window[callbackName];
            };

            // Создаем тег <script>, браузер загрузит его без блокировок
            const script = document.createElement('script');
            script.src = `${SCRIPT_URL}?id=${encodeURIComponent(id)}&callback=${callbackName}`;
            
            // Обработка ошибки загрузки (например, если ссылка неверная)
            script.onerror = function() {
                resultDiv.innerHTML = '<span class="error">Ошибка сети. Проверьте ссылку на скрипт.</span>';
                document.body.removeChild(script);
                delete window[callbackName];
            };

            document.body.appendChild(script);
        }
    </script>

</body>
</html>
